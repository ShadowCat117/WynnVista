plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation 'com.google.code.gson:gson:2.8.9'

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Distant Horizons API (optional - compile only)
    compileOnly "maven.modrinth:DistantHorizonsApi:${project.dh_api_version}"

    // Distant Horizons mod (runtime only for testing)
    // runtimeOnly "maven.modrinth:DistantHorizons:${project.dh_mod_version}"

    // Voxy (optional - compile only)
//    compileOnly "maven.modrinth:voxy:${project.voxy_version}"

    // Voxy mod (runtime only for testing) - uncomment to test with Voxy instead of DH
//    runtimeOnly "maven.modrinth:voxy:${project.voxy_version}"

    // ModMenu
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Cloth Config
    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}